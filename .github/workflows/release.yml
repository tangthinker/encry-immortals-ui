name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  GO_VERSION: '1.27.1'

jobs:
  macos:
    name: Build macOS universal
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # 配了 Developer ID 证书 secret 才走签名+公证；否则保持原来的 ad-hoc 流程。
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: third_party/encry-immortals/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          set -euo pipefail
          flutter --version
          go version
          xcodebuild -version

      - name: Install dependencies
        run: flutter --no-version-check pub get

      - name: Analyze
        run: flutter --no-version-check analyze

      - name: Unit and widget tests
        run: flutter --no-version-check test

      - name: Import Developer ID certificate
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./tool/ci_import_signing_cert.sh

      - name: Write notarization API key
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build signed universal app
        run: |
          set +e
          ./tool/build_macos.sh > build-macos.log 2>&1
          status=$?
          tail -80 build-macos.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < <(tail -30 build-macos.log)
          fi
          exit "$status"

      - name: Verify bundle and architectures
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Encry Immortals.app"
          dart run tool/verify_bundle.dart "$APP" "$(cat build/core/eimmortal.sha256)"
          SIDECAR_ARCHS="$(lipo -archs "$APP/Contents/Resources/bin/eimmortal")"
          APP_ARCHS="$(lipo -archs "$APP/Contents/MacOS/Encry Immortals")"
          echo "sidecar archs: $SIDECAR_ARCHS"
          echo "app archs: $APP_ARCHS"
          [[ "$SIDECAR_ARCHS" == *arm64* && "$SIDECAR_ARCHS" == *x86_64* ]] || {
            echo "::error::sidecar is not universal: $SIDECAR_ARCHS"
            exit 1
          }
          [[ "$APP_ARCHS" == *arm64* && "$APP_ARCHS" == *x86_64* ]] || {
            echo "::error::app is not universal: $APP_ARCHS"
            exit 1
          }

      - name: Notarize app and staple
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./tool/notarize_macos.sh "build/macos/Build/Products/Release/Encry Immortals.app"

      - name: Package zip and dmg
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Encry Immortals.app"
          BASE="Encry-Immortals-${GITHUB_REF_NAME}-macOS-universal"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "${BASE}.zip"

          mkdir -p build/dmg
          # 用 ditto 而不是 cp：公证票据是 bundle 里的文件/扩展属性，cp 可能丢。
          ditto "$APP" "build/dmg/$(basename "$APP")"
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "Encry Immortals" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "${BASE}.dmg"

          if [[ -n "${CODESIGN_IDENTITY:-}" && "${CODESIGN_IDENTITY}" != "-" ]]; then
            codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "${BASE}.dmg"
          fi

          ls -lh "${BASE}.zip" "${BASE}.dmg"

      - name: Notarize dmg and staple
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="$(ls Encry-Immortals-*-macOS-universal.dmg)"
          ./tool/notarize_macos.sh "$DMG"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            Encry-Immortals-*.zip
            Encry-Immortals-*.dmg
          if-no-files-found: error
          retention-days: 7


  macos-arm64:
    name: Build macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # 配了 Developer ID 证书 secret 才走签名+公证；否则保持原来的 ad-hoc 流程。
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: third_party/encry-immortals/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter --no-version-check pub get

      - name: Import Developer ID certificate
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./tool/ci_import_signing_cert.sh

      - name: Write notarization API key
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build signed arm64 app
        env:
          TARGET_ARCH: arm64
        run: |
          set +e
          ./tool/build_macos.sh > build-macos-arm64.log 2>&1
          status=$?
          tail -80 build-macos-arm64.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < <(tail -30 build-macos-arm64.log)
          fi
          exit "$status"

      - name: Verify arm64 bundle
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Encry Immortals.app"
          dart run tool/verify_bundle.dart "$APP" "$(cat build/core/eimmortal.sha256)"
          SIDECAR_ARCHS="$(lipo -archs "$APP/Contents/Resources/bin/eimmortal")"
          APP_ARCHS="$(lipo -archs "$APP/Contents/MacOS/Encry Immortals")"
          echo "sidecar archs: $SIDECAR_ARCHS"
          echo "app archs: $APP_ARCHS"
          [[ "$SIDECAR_ARCHS" == "arm64" ]] || {
            echo "::error::arm64 sidecar expected exactly arm64: $SIDECAR_ARCHS"
            exit 1
          }
          [[ "$APP_ARCHS" == *arm64* ]] || {
            echo "::error::app is missing arm64: $APP_ARCHS"
            exit 1
          }

      - name: Notarize app and staple
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./tool/notarize_macos.sh "build/macos/Build/Products/Release/Encry Immortals.app"

      - name: Package arm64 zip and dmg
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Encry Immortals.app"
          BASE="Encry-Immortals-${GITHUB_REF_NAME}-macOS-arm64"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "${BASE}.zip"

          mkdir -p build/dmg
          # 用 ditto 而不是 cp：公证票据是 bundle 里的文件/扩展属性，cp 可能丢。
          ditto "$APP" "build/dmg/$(basename "$APP")"
          ln -s /Applications build/dmg/Applications
          hdiutil create             -volname "Encry Immortals"             -srcfolder build/dmg             -ov -format UDZO             "${BASE}.dmg"

          if [[ -n "${CODESIGN_IDENTITY:-}" && "${CODESIGN_IDENTITY}" != "-" ]]; then
            codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "${BASE}.dmg"
          fi

          ls -lh "${BASE}.zip" "${BASE}.dmg"

      - name: Notarize dmg and staple
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="$(ls Encry-Immortals-*-macOS-arm64.dmg)"
          ./tool/notarize_macos.sh "$DMG"

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            Encry-Immortals-*-macOS-arm64.zip
            Encry-Immortals-*-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: third_party/encry-immortals/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain versions
        shell: pwsh
        run: |
          flutter --version
          go version
          cmake --version

      - name: Install dependencies
        run: flutter --no-version-check pub get

      - name: Analyze
        run: flutter --no-version-check analyze

      - name: Build Windows app and sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tool\build_windows.ps1
          $appDir = "build\windows\x64\runner\Release"
          if (!(Test-Path "$appDir\encry_immortals_ui.exe")) {
            throw "missing app executable at $appDir\encry_immortals_ui.exe"
          }
          if (!(Test-Path "$appDir\bin\eimmortal-gui.exe")) {
            throw "missing sidecar at $appDir\bin\eimmortal-gui.exe"
          }
          $core = Get-Content "$appDir\core-build.txt"
          if ($core.Count -lt 2) { throw "core-build.txt is incomplete" }
          $expected = $core[1].Trim().ToLower()
          $actual = (Get-FileHash "$appDir\bin\eimmortal-gui.exe" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "bundled sidecar hash mismatch: $actual != $expected"
          }
          Write-Host "Windows app ready: $appDir"

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}".TrimStart("v")
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup ISCC.exe not found" }
          & $iscc "/DMyAppVersion=$version" "packaging\windows\encry-immortals.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = "build\installer\Encry-Immortals-$version-Windows-x64.exe"
          if (!(Test-Path $installer)) { throw "missing installer: $installer" }

          $stage = "build\portable\Encry Immortals"
          Remove-Item "build\portable" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build\windows\x64\runner\Release\*" $stage -Recurse -Force
          Compress-Archive -Path $stage `
            -DestinationPath "build\installer\Encry-Immortals-$version-Windows-x64-portable.zip" `
            -Force
          Get-ChildItem "build\installer" | Format-Table Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/installer/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [macos, macos-arm64, windows]
    runs-on: ubuntu-latest
    env:
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist/macos

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/macos-arm64

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/windows

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Encry Immortals ${{ github.ref_name }}
          body: |
            ## Encry Immortals ${{ github.ref_name }}

            ### Highlights

            - Workspaces: create, import and switch multiple workspaces. Each workspace keeps its own
              `profile.json`, `config.toml` and local vault; existing single-workspace profiles are migrated on first launch.
            - Backup page: when a run reaches `session_max_mib`, keep **继续备份** for one more run,
              or use **持续备份到所有数据备份完毕** to repeat automatically until no data remains.
              Continuous mode supports stopping between rounds and stops itself when a round makes no progress.

            ### macOS

            - Universal app: Apple Silicon + Intel (`x86_64 arm64`).
            - Dedicated Apple Silicon build (`arm64`), kept for users who prefer the architecture-specific package.
            - Universal and arm64 sidecars are signed and hash-pinned at build time.
            ${{ env.MACOS_SIGNING_ENABLED == 'true' && '- Developer ID signed with hardened runtime, notarized by Apple, and stapled — Gatekeeper opens it without a workaround.' || '- Ad-hoc signed, **not notarized**. If Gatekeeper blocks the app, right-click → Open, or run: `xattr -dr com.apple.quarantine "Encry Immortals.app"`.' }}

            ### Windows

            - Windows x64 installer (Inno Setup) and portable zip.
            - **Unsigned**; Authenticode signing is still on the roadmap.
            - Windows GUI-subsystem stdio/control locks are exercised in CI but not yet validated on a physical Windows host.

            ### Quality

            - Flutter `3.47.5`, Go `1.27.1`, core `v0.1.5`.
            - `flutter analyze`, 102 unit/widget tests, and sidecar SHA-256 verification.
          files: |
            dist/macos/*
            dist/macos-arm64/*
            dist/windows/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
